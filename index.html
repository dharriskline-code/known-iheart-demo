<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KNOWN — Podcast Intelligence Platform</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #F7F4EF; color: #0F0E0C; }
  button { font-family: Georgia, serif; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #EEE9E1; }
  ::-webkit-scrollbar-thumb { background: #CCC7BE; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const C = {
  ink: "#0F0E0C", ink2: "#3D3A35", ink3: "#7A756D",
  cream: "#F7F4EF", cream2: "#EEE9E1", border: "#DDD8CF",
  accent: "#C8522A", accentL: "#F5EAE4",
  green: "#2E6B4F", greenL: "#E4F0EA",
  gold: "#A07830", goldL: "#F4EDD8",
  blue: "#2A5078", blueL: "#E0EBF4",
  purple: "#5C3D8C", purpleL: "#EDE8F5",
  white: "#FFFFFF",
};
const HEAD_C = "#2A5078", HEART_C = "#C8522A", BODY_C = "#2E6B4F";
const HEAD_L = "#E0EBF4", HEART_L = "#F5EAE4", BODY_L = "#E4F0EA";

// ─── UTILITIES ────────────────────────────────────────────────────────────────
const getIC = t => t==="head"?HEAD_C:t==="heart"?HEART_C:BODY_C;
const getIL = t => t==="head"?HEAD_L:t==="heart"?HEART_L:BODY_L;

function IB({ type }) {
  return <span style={{ background: getIL(type), color: getIC(type), fontFamily:"monospace",
    fontSize:8, fontWeight:700, letterSpacing:"0.1em", padding:"3px 8px", borderRadius:3 }}>
    {type.toUpperCase()}
  </span>;
}
function Tag({ children, color=C.ink3, bg=C.cream2 }) {
  return <span style={{ background:bg, color, fontSize:8, fontFamily:"monospace",
    fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", padding:"3px 8px", borderRadius:2 }}>
    {children}
  </span>;
}
function Card({ children, style={} }) {
  return <div style={{ background:C.white, border:`0.5px solid ${C.border}`, borderRadius:8, padding:18, ...style }}>{children}</div>;
}
function SL({ children, color=C.ink3 }) {
  return <div style={{ fontFamily:"monospace", fontSize:9, color, letterSpacing:"0.13em",
    textTransform:"uppercase", marginBottom:8 }}>{children}</div>;
}
function Hr({ my=14 }) { return <div style={{ borderTop:`0.5px solid ${C.border}`, margin:`${my}px 0` }} />; }
function Dot({ color=C.accent }) {
  return <div style={{ width:4, height:4, borderRadius:"50%", background:color, marginTop:7, flexShrink:0 }} />;
}
function ScoreCircle({ score, color, size=56 }) {
  const r=size/2-5, circ=2*Math.PI*r, dash=(score/100)*circ;
  return <div style={{ position:"relative", width:size, height:size, flexShrink:0 }}>
    <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.border} strokeWidth={4}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={4}
        strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"/>
    </svg>
    <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <span style={{ fontSize:size>50?13:11, fontWeight:700, color }}>{score}</span>
    </div>
  </div>;
}
function IntelBar({ dominant, secondary, tertiary, dp, sp, tp }) {
  return <div style={{ marginBottom:12 }}>
    <div style={{ display:"flex", height:7, borderRadius:4, overflow:"hidden", gap:2 }}>
      {[[dominant,dp],[secondary,sp],[tertiary,tp]].map(([t,p],i)=>
        <div key={i} style={{ width:`${p}%`, background:getIC(t), borderRadius:2 }}/>)}
    </div>
    <div style={{ display:"flex", gap:12, marginTop:5 }}>
      {[[dominant,dp],[secondary,sp],[tertiary,tp]].map(([t,p],i)=>
        <div key={i} style={{ display:"flex", alignItems:"center", gap:4 }}>
          <div style={{ width:7, height:7, borderRadius:"50%", background:getIC(t) }}/>
          <span style={{ fontSize:9, color:C.ink3, fontFamily:"monospace" }}>{t.toUpperCase()} {p}%</span>
        </div>)}
    </div>
  </div>;
}

// ─── HOST CARD ────────────────────────────────────────────────────────────────
function HostCard({ host }) {
  const [tab, setTab] = React.useState("profile");
  return <Card style={{ flex:1 }}>
    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
      <div>
        <div style={{ fontWeight:700, fontSize:14, color:C.ink, marginBottom:2 }}>{host.name}</div>
        <div style={{ fontSize:9, color:C.ink3, fontFamily:"monospace" }}>{host.role}</div>
      </div>
      <IB type={host.dominant}/>
    </div>
    <SL>Intelligence Profile</SL>
    <IntelBar dominant={host.dominant} secondary={host.secondary} tertiary={host.tertiary}
      dp={host.dp} sp={host.sp} tp={host.tp}/>
    <div style={{ display:"flex", borderBottom:`0.5px solid ${C.border}`, marginBottom:12 }}>
      {["profile","clips"].map(t=>(
        <button key={t} onClick={()=>setTab(t)} style={{
          background:"none", border:"none", padding:"5px 12px", cursor:"pointer",
          fontFamily:"monospace", fontSize:9, letterSpacing:"0.1em", textTransform:"uppercase",
          color:tab===t?C.accent:C.ink3,
          borderBottom:tab===t?`2px solid ${C.accent}`:"2px solid transparent", marginBottom:-1
        }}>{t}</button>
      ))}
    </div>
    {tab==="profile" && <div>
      {[
        { label:"Dominant", type:host.dominant, desc:host.dominantDesc },
        { label:"Secondary", type:host.secondary, desc:host.secondaryDesc },
        { label:"Tertiary — Growth Edge", type:host.tertiary, desc:host.tertiaryDesc },
      ].map((item,i)=>(
        <div key={i} style={{
          borderLeft:`2px solid ${getIC(item.type)}`, marginBottom:10,
          ...(i===2
            ? { background:C.cream2, borderRadius:"0 4px 4px 0", padding:"8px 10px" }
            : { paddingLeft:10 })
        }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
            <span style={{ fontSize:9, fontFamily:"monospace", color:getIC(item.type), fontWeight:700 }}>
              {item.label.toUpperCase()}
            </span>
            <IB type={item.type}/>
          </div>
          <p style={{ fontSize:11, color:C.ink2, lineHeight:1.6, margin:0 }}>{item.desc}</p>
        </div>
      ))}
      <Hr/>
      <SL>Transcript Signals</SL>
      {host.signals.map((s,i)=>(
        <div key={i} style={{ display:"flex", gap:8, alignItems:"flex-start", marginBottom:6 }}>
          <Dot/><p style={{ fontSize:11, color:C.ink2, lineHeight:1.55, margin:0 }}>{s}</p>
        </div>
      ))}
    </div>}
    {tab==="clips" && <div>
      {host.clips.length===0
        ? <p style={{ fontSize:11, color:C.ink3, fontStyle:"italic" }}>Clip analysis requires additional episode transcripts.</p>
        : host.clips.map((c,i)=>(
          <div key={i} style={{ border:`0.5px solid ${C.border}`, borderRadius:6, padding:12, marginBottom:10 }}>
            <Tag color={C.blue} bg={C.blueL}>{c.type}</Tag>
            <div style={{ fontWeight:600, fontSize:12, color:C.ink, margin:"6px 0 4px" }}>{c.label}</div>
            <p style={{ fontSize:11, color:C.ink2, lineHeight:1.55, margin:0 }}>{c.note}</p>
          </div>
        ))
      }
    </div>}
  </Card>;
}

// ─── MARKETING INTELLIGENCE (DEEP) ───────────────────────────────────────────
function MarketingIntel() {
  const platforms = [
    {
      platform: "TikTok / Instagram Reels",
      color: C.accent, bg: C.accentL,
      strategy: "Lead with tertiary Body activation — not the guest name.",
      clips: [
        { label: "Nicole's falafel IDTSH", timing: "Min 79–81", why: "60 seconds. Zero context required. Self-contained, escalating, ends on a quotable line. Nicole Kidman saying 'no more falafel before you make love' stops every scroll. This is the highest-velocity clip in the episode and it currently doesn't exist in their marketing." },
        { label: "'I am in a state of yearning right now'", timing: "Min 17", why: "4-second hook, then cut to both hosts reacting. This is the clip that defines what kind of show this is — a place where Nicole Kidman says things she doesn't say in press junkets. Lead with the quote as text on screen, then play the audio." },
        { label: "Bowen's outdoor furniture IDTSH", timing: "Min 75–77", why: "Body activation from the more analytical host. Surprising because it's Bowen. The contrast with his usual register is what makes it shareable — audiences who know him feel rewarded." },
      ],
      avoid: "Do not lead with 'Nicole Kidman on Culturistas.' Guest name-first is the lowest-performing clip strategy for this show. The guest is not the differentiator — the format is."
    },
    {
      platform: "YouTube Shorts",
      color: C.blue, bg: C.blueL,
      strategy: "Lead with host vulnerability as the hook — not guest name, not topic.",
      clips: [
        { label: "Matt's Batman Forever disclosure", timing: "Min 22", why: "Matt saying 'I found out something about myself seeing that picture of you on the VHS cover' is a queer awakening disclosure from a podcast host — not a guest. This has never been clipped. It is the show's most powerful acquisition hook for the LGBTQ+ audience it hasn't reached yet." },
        { label: "Nicole on her mother's cancer", timing: "Min 11–12", why: "Nicole Kidman opening up about nursing her mother — unprompted, within 15 minutes, in a way she does not do on press tours. This clip does not exist in the show's marketing. It is the single strongest argument for why new listeners should subscribe." },
      ],
      avoid: "Do not clip cultural analysis segments for YouTube Shorts — they require episode context to land. The show's Head intelligence (cultural frameworks, reference-heavy takes) performs for existing listeners, not for acquisition."
    },
    {
      platform: "Podcast Promo / Audio",
      color: C.green, bg: C.greenL,
      strategy: "Use the episode title as the hook — then pair it with a guest quote that fulfills the promise of that title.",
      clips: [
        { label: "'Shivery Delicious' + yearning sequence", timing: "Min 17–18", why: "The episode title is coined by Nicole in real time and the hosts immediately recognize it. This 30-second exchange is a perfect podcast promo — it names the feeling the episode creates before explaining what the episode is about. Currently unused." },
        { label: "Matt's intro disclosure before the guest arrives", timing: "Min 1–4", why: "Matt's personal cultural history — how Moulin Rouge was formative for him — delivered before Nicole joins. This is the hosts going first emotionally. Clip this as the proof that the hosts do the work before the guest arrives." },
      ],
      avoid: "Do not use episode recaps or topic lists as promo. 'Matt and Bowen discuss Nicole Kidman's career' is not a hook. The feeling is the hook."
    },
    {
      platform: "Long-Form YouTube",
      color: C.purple, bg: C.purpleL,
      strategy: "Clip the relationship between the hosts, not just the guest moments. The hosts' chemistry is the reason people subscribe.",
      clips: [
        { label: "Matt and Bowen reacting to each other during IDTSH", timing: "Min 70–82", why: "The full IDTSH sequence — all three rants plus the group song close — shows the show's actual format in action. No existing long-form clip demonstrates what IDTSH is as a recurring segment. This is the one that converts viewers into subscribers." },
        { label: "The yearning conversation + Shivery Delicious coinage", timing: "Min 16–18", why: "This 2-minute sequence moves from an unexpected philosophical discussion into a spontaneous naming moment. It shows what the show is when it's at its best — unscripted, specific, and emotionally specific. New viewers need to see this before they'll commit to an episode." },
      ],
      avoid: "Do not post full episodes without a clip-first strategy. The episode is 85 minutes — viewers need 90 seconds of proof first."
    },
  ];

  const positioning = [
    { current: "Pop culture podcast with [guest name]", problem: "Guest-led. Interchangeable with every other pop culture show. Does not name the format or what makes it different.", fix: "The podcast that makes icons say things they don't say anywhere else." },
    { current: "Las Culturistas / Culturistas [episode number]", problem: "The episode title 'Shivery Delicious' is the best marketing asset in this episode and it's being used as an afterthought, not a headline.", fix: "Lead every piece of marketing with the episode title. 'Shivery Delicious with Nicole Kidman.' The title is the emotional promise." },
    { current: "Matt Rogers and Bowen Yang", problem: "Host names are the entire brand description. There is no positioning language that tells new listeners what the show feels like.", fix: "10 years of queer pop culture. We did the homework so the conversation can go somewhere else." },
  ];

  return <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
    <Card style={{ borderLeft:`3px solid ${C.accent}`, background:C.accentL }}>
      <SL color={C.accent}>The Core Problem</SL>
      <p style={{ fontSize:13, color:C.ink, lineHeight:1.7, margin:0, fontWeight:500 }}>
        Culturistas is currently marketing the guest. The show's actual differentiator is the format — specifically, the permission structure that makes guests say things they don't say elsewhere. No clip in their current marketing demonstrates this. Every platform strategy below is built around showing the format first, the guest second.
      </p>
    </Card>

    <div style={{ fontWeight:700, fontSize:14, color:C.ink, marginBottom:-4 }}>Platform-Specific Clip Strategy</div>
    {platforms.map((pl,i)=>(
      <Card key={i}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
          <Tag color={pl.color} bg={pl.bg}>{pl.platform}</Tag>
        </div>
        <div style={{ background:pl.bg, borderLeft:`2px solid ${pl.color}`, padding:"8px 12px", borderRadius:"0 4px 4px 0", marginBottom:12 }}>
          <p style={{ fontSize:12, color:C.ink, margin:0, fontWeight:500 }}>{pl.strategy}</p>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:12 }}>
          {pl.clips.map((c,j)=>(
            <div key={j} style={{ border:`0.5px solid ${C.border}`, borderRadius:6, padding:12 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                <span style={{ fontWeight:700, fontSize:12, color:C.ink }}>{c.label}</span>
                <Tag>{c.timing}</Tag>
              </div>
              <p style={{ fontSize:11, color:C.ink2, lineHeight:1.6, margin:0 }}>{c.why}</p>
            </div>
          ))}
        </div>
        <div style={{ background:C.cream2, borderRadius:4, padding:"8px 12px" }}>
          <span style={{ fontSize:9, fontFamily:"monospace", color:C.ink3, fontWeight:700, letterSpacing:"0.08em" }}>AVOID — </span>
          <span style={{ fontSize:11, color:C.ink2 }}>{pl.avoid}</span>
        </div>
      </Card>
    ))}

    <div style={{ fontWeight:700, fontSize:14, color:C.ink, marginBottom:-4 }}>Positioning Language</div>
    {positioning.map((p,i)=>(
      <Card key={i}>
        <div style={{ display:"flex", gap:14 }}>
          <div style={{ flex:1, borderRight:`0.5px solid ${C.border}`, paddingRight:14 }}>
            <SL color={C.accent}>Current</SL>
            <p style={{ fontSize:12, color:C.ink, margin:"0 0 6px", fontWeight:600 }}>{p.current}</p>
            <p style={{ fontSize:11, color:C.ink3, lineHeight:1.55, margin:0, fontStyle:"italic" }}>{p.problem}</p>
          </div>
          <div style={{ flex:1, paddingLeft:0 }}>
            <SL color={C.green}>Recommended</SL>
            <p style={{ fontSize:12, color:C.ink, margin:0, fontWeight:600, lineHeight:1.6 }}>{p.fix}</p>
          </div>
        </div>
      </Card>
    ))}
  </div>;
}

// ─── CREATIVE DEVELOPMENT ─────────────────────────────────────────────────────
function CreativeDev() {
  const issues = [
    {
      title: "The IDTSH Segment Is in the Wrong Place",
      severity: "high", color: C.accent, bg: C.accentL,
      current: "Currently placed at minute 70–90. It functions as a dessert — a reward for listeners who stayed for the whole episode.",
      problem: "The IDTSH segment activates Body/gut intelligence — the tertiary dimension for both hosts. Moving it to the end means the most dimensionally surprising content in the episode comes after most potential new listeners have already dropped off. And because it comes at the end, it can't elevate the content that follows it.",
      fix: "Move IDTSH to minute 25–35. After the guest relationship is established but before the deep dive. At that position, the Body activation resets the episode's energy and RAISES the ceiling on the Heart/Head exchange that follows. Right now the show uses it as a close — it should be a structural pivot.",
      bonus: "Also: establish a consistent order. Guest does IDTSH first, then both hosts respond. This creates the contrast moment — guest's instinct vs. hosts' instinct — that doesn't currently exist."
    },
    {
      title: "Matt and Bowen Never Disagree",
      severity: "medium", color: C.gold, bg: C.goldL,
      current: "In 85 minutes of this episode, there is zero on-screen disagreement between the hosts. They defer to each other gracefully throughout.",
      problem: "This is the show's creative ceiling. Both hosts are Heart + Head — they are both inclined toward harmony and away from conflict. The result is a show that is emotionally warm and intellectually rich but structurally safe. The hosts' relationship never creates tension — which means the episode's energy depends entirely on the guest.",
      fix: "Design one segment per episode where the hosts take opposing positions. Not manufactured conflict — structured disagreement. Give it a name. 'Bowen vs. Matt on [topic].' This activates Bowen's Head in challenge mode and Matt's Heart under pressure — the two most interesting versions of each host. It also gives the show a second clippable format asset alongside IDTSH.",
      bonus: null
    },
    {
      title: "Nicole's Mother Story Was Not Followed",
      severity: "high", color: C.accent, bg: C.accentL,
      current: "At minute 11–12, Nicole discloses nursing her mother through cancer. Matt responds with 'Sorry to get serious' and immediately pivots away.",
      problem: "This is the show pulling back from its deepest possible moment. Nicole's Heart dimension was fully open — she was in the most vulnerable register she entered in the entire episode. The pivot to comfort was a missed opportunity that the transcript makes visible because Nicole does not return to this depth again.",
      fix: "Train both hosts to recognize when a guest's Heart intelligence has opened fully and to honor it rather than redirect away from it. The host's instinct to relieve discomfort (also a Heart response) is working against the show's strongest content. The rule: when a guest goes deeper than expected, go with them for at least 60 more seconds before moving on.",
      bonus: "This is coachable. It's not a flaw in the hosts — it's a habit. The system can flag these moments in the transcript so the production team can review them in pre-show prep."
    },
    {
      title: "The Tri-Intelligence Balance Is Off for This Length",
      severity: "medium", color: C.gold, bg: C.goldL,
      current: "Full episode breakdown: Heart ~65% · Head ~28% · Body ~7%",
      problem: "For an 85-minute episode, Body activation at 7% means the show has one gear change in the entire runtime. IDTSH carries all of it. The result is an episode that is emotionally consistent but dimensionally flat across the middle — which is where listener dropout is highest.",
      fix: "Target: Heart 55% · Head 30% · Body 15%. Add 2–3 additional Body activation moments built into structure — not just IDTSH. Candidates: a rapid-fire association round, a 'first instinct' segment where analysis is not allowed, a physical or sensory question sequence. Each of these can be named, branded, and clipped.",
      bonus: null
    },
  ];

  return <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
    <Card style={{ background:C.ink, border:`0.5px solid ${C.ink}` }}>
      <SL color="rgba(255,255,255,0.4)">What This Analysis Is</SL>
      <p style={{ fontSize:12, color:"rgba(255,255,255,0.82)", lineHeight:1.7, margin:0 }}>
        This is not a critique of the show — Culturistas is performing well and its core identity is healthy. This is a precision analysis of where the show is leaving dimension on the table. Every recommendation below is grounded in specific transcript moments, not editorial opinion. The goal is not to change the show — it is to help the show become more fully what it already is.
      </p>
    </Card>
    {issues.map((item,i)=>(
      <Card key={i} style={{ borderTop:`3px solid ${item.color}` }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
          <div style={{ fontWeight:700, fontSize:14, color:C.ink }}>{item.title}</div>
          <Tag color={item.color} bg={item.bg}>{item.severity === "high" ? "High Priority" : "Medium Priority"}</Tag>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          <div>
            <SL>Current State</SL>
            <p style={{ fontSize:12, color:C.ink2, lineHeight:1.6, margin:0 }}>{item.current}</p>
          </div>
          <div style={{ background:C.cream2, borderRadius:4, padding:"10px 12px" }}>
            <SL>Why This Matters</SL>
            <p style={{ fontSize:12, color:C.ink, lineHeight:1.6, margin:0 }}>{item.problem}</p>
          </div>
          <div style={{ borderLeft:`2px solid ${C.green}`, paddingLeft:12 }}>
            <SL color={C.green}>Recommendation</SL>
            <p style={{ fontSize:12, color:C.ink, lineHeight:1.6, margin:0 }}>{item.fix}</p>
          </div>
          {item.bonus && (
            <div style={{ borderLeft:`2px solid ${C.blue}`, paddingLeft:12, background:C.blueL, borderRadius:"0 4px 4px 0", padding:"8px 12px" }}>
              <SL color={C.blue}>Additional Note</SL>
              <p style={{ fontSize:11, color:C.ink, lineHeight:1.55, margin:0 }}>{item.bonus}</p>
            </div>
          )}
        </div>
      </Card>
    ))}
  </div>;
}

// ─── SHOW TEMPLATE ────────────────────────────────────────────────────────────
function ShowTemplate() {
  const principles = [
    {
      num: "01", title: "The Chemistry Principle",
      color: HEART_C, bg: HEART_L,
      rule: "Pair hosts with different dominant intelligences. Never pair the same dominant unless the format explicitly creates contrast between them.",
      culturistas: "Matt (Heart) + Bowen (Head). Their dominant intelligences are different enough to create genuine exchange and similar enough in tertiary (both Body-weak) to share a consistent blind spot the format must address.",
      apply: "When developing a new show, map host intelligence types before anything else. The pairing decision is the most consequential creative decision you will make. A Heart + Head pairing creates warmth with structure. A Body + Head pairing (like Health Stuff) creates energy with analysis. A Body + Heart pairing creates instinct with emotion. Each combination produces different chemistry and requires different format solutions.",
      warning: "Two hosts with the same dominant intelligence will always default to agreement. The show will be consistent but it will not generate tension. You will need to manufacture conflict structurally or the episodes will feel flat."
    },
    {
      num: "02", title: "The Permission Structure Principle",
      color: HEART_C, bg: HEART_L,
      rule: "The host must go first emotionally. If the host only asks questions, the guest only gives answers.",
      culturistas: "Matt's Batman Forever disclosure, his yearning confession, his Antarctica story — all of these come BEFORE he asks Nicole anything personal. He goes first every time. Nicole's vulnerability with her mother's cancer story is a direct result of Matt having already opened his own emotional register.",
      apply: "In any host-driven show, build pre-guest segments where the hosts disclose something personal about their relationship to the episode's topic. This is not small talk — it is the structural foundation that makes guest depth possible. If the hosts are emotionally closed when the guest arrives, the guest will stay emotionally closed.",
      warning: "Hosts who lead only with questions are creating interview shows, not conversation shows. The distinction matters for audience loyalty. Interviews have guests. Conversations have participants."
    },
    {
      num: "03", title: "The Tertiary Activation Principle",
      color: BODY_C, bg: BODY_L,
      rule: "Every show needs a built-in segment that forces hosts out of their dominant intelligence. Name it. Brand it. Put it in the same place every episode.",
      culturistas: "IDTSH — 'I Don't Think So, Honey.' A timed, opinionated rant that forces Body/gut activation on Heart + Head hosts who never go there naturally. Nicole Kidman ranting about bad breath is the most clippable 90 seconds in the episode. It works because it activates the dimension both hosts (and the guest) never use.",
      apply: "Identify the tertiary intelligence of your hosts. Design a segment that forces them into it. Give it a name that can be used in marketing and clip titles. Hot Ones is this principle at its most developed — the hot sauce forces a physical/instinctive response from guests who came prepared to be intellectual and articulate. Every show needs its Hot Ones equivalent.",
      warning: "This segment will always be your most clippable content. It should not be at the end of the episode. Place it at 25–40% of the runtime so it can raise the ceiling on what follows, not reward listeners who stayed until the end."
    },
    {
      num: "04", title: "The Episode Architecture Principle",
      color: HEAD_C, bg: HEAD_L,

      justifyContent:"space-between", height:50, position:"sticky", top:0, zIndex:100 }}>
      <div style={{ display:"flex", alignItems:"center", gap:14 }}>
        <div style={{ fontFamily:"Georgia, serif", fontSize:17, color:C.white, letterSpacing:"0.04em" }}>
          K<span style={{ color:C.accent, fontStyle:"italic" }}>N</span>OWN
        </div>
        <div style={{ fontFamily:"monospace", fontSize:8, color:"rgba(255,255,255,0.3)", letterSpacing:"0.12em", textTransform:"uppercase" }}>
          Podcast Intelligence Platform
        </div>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        <div style={{ fontFamily:"monospace", fontSize:8, color:"rgba(255,255,255,0.3)", letterSpacing:"0.1em", textTransform:"uppercase" }}>iHeart — Pilot</div>
        <div style={{ background:C.accent, color:C.white, fontSize:8, fontWeight:700, padding:"2px 8px", borderRadius:3, textTransform:"uppercase" }}>Beta</div>
      </div>
    </div>

    <div style={{ display:"flex" }}>
      {/* Sidebar */}
      <div style={{ width:200, background:C.white, borderRight:`0.5px solid ${C.border}`,
        padding:"18px 0", flexShrink:0, minHeight:"calc(100vh - 50px)", position:"sticky", top:50, overflowY:"auto" }}>
        <div style={{ padding:"0 14px", marginBottom:18 }}>
          <div style={{ fontFamily:"monospace", fontSize:8, color:C.ink3, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:6 }}>Modules</div>
          {[{id:"diagnostic",label:"Show Diagnostic"},{id:"talent",label:"Talent Evaluator"},{id:"chemistry",label:"Chemistry Lab"},{id:"ip",label:"IP Expansion · Podcast to Film/TV"}].map(v=>(
            <button key={v.id} onClick={()=>setView(v.id)} style={{
              width:"100%", textAlign:"left", padding:"8px 10px", borderRadius:4,
              background:view===v.id?C.ink:"transparent",
              color:view===v.id?C.white:C.ink2,
              border:"none", cursor:"pointer", fontSize:12,
              fontFamily:"Georgia, serif", marginBottom:2,
              fontWeight:view===v.id?700:400,
            }}>{v.label}</button>
          ))}
        </div>
        {view==="diagnostic" && (
          <div style={{ padding:"0 14px" }}>
            <div style={{ fontFamily:"monospace", fontSize:8, color:C.ink3, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:8 }}>Shows</div>
            {[{id:"culturistas",label:"Culturistas",status:"performing"},{id:"health",label:"Health Stuff",status:"underperforming"}].map(s=>(
              <button key={s.id} onClick={()=>setActiveShow(s.id)} style={{
                width:"100%", textAlign:"left", padding:"10px 10px", borderRadius:4,
                background:activeShow===s.id?C.cream2:"transparent",
                border:activeShow===s.id?`0.5px solid ${C.border}`:"0.5px solid transparent",
                cursor:"pointer", marginBottom:4, display:"block"
              }}>
                <div style={{ fontSize:11, fontWeight:600, color:C.ink, marginBottom:4 }}>{s.label}</div>
                <Tag color={s.status==="underperforming"?C.accent:C.green} bg={s.status==="underperforming"?C.accentL:C.greenL}>
                  {s.status}
                </Tag>
              </button>
            ))}
          </div>
        )}
        {view==="diagnostic" && activeShow==="culturistas" && (
          <div style={{ padding:"12px 14px 0", borderTop:`0.5px solid ${C.border}`, marginTop:12 }}>
            <div style={{ fontFamily:"monospace", fontSize:8, color:C.ink3, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:6 }}>Tabs Available</div>
            {["Hosts","Chemistry","Segments","Marketing","Creative","Template"].map((t,i)=>(
              <div key={i} style={{ fontSize:10, color:C.ink3, padding:"3px 0", borderBottom:`0.5px solid ${C.border}` }}>{t}</div>
            ))}
          </div>
        )}
      </div>

      {/* Main */}
      <div style={{ flex:1, padding:24, paddingBottom:60, overflowY:"auto" }}>
        {view==="diagnostic" && (
          <ShowDiagnostic
            data={activeShow==="culturistas"?CULTURISTAS_DATA:HEALTH_DATA}
            isPerforming={activeShow==="culturistas"}
          />
        )}
        {view==="talent" && <TalentEvaluator/>}
        {view==="chemistry" && <ChemistryLab/>}
        {view==="ip" && <IPExpansion/>}
      </div>
    </div>

    {/* Footer */}
    <div style={{ position:"fixed", bottom:0, left:200, right:0, background:C.white,
      borderTop:`0.5px solid ${C.border}`, padding:"8px 24px",
      display:"flex", alignItems:"center", justifyContent:"space-between", zIndex:50 }}>
      <div style={{ fontFamily:"monospace", fontSize:9, color:C.ink3 }}>
        AI on the back end &nbsp;·&nbsp; Human on the front end
      </div>
      <div style={{ display:"flex", gap:14 }}>
        {[["HEAD",HEAD_C],["HEART",HEART_C],["BODY",BODY_C]].map(([label,color])=>(
          <div key={label} style={{ display:"flex", alignItems:"center", gap:4 }}>
            <div style={{ width:6, height:6, borderRadius:"50%", background:color }}/>
            <span style={{ fontSize:9, fontFamily:"monospace", color:C.ink3 }}>{label}</span>
          </div>
        ))}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
